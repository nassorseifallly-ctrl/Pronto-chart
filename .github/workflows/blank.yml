name: Build PRONTO CHAT APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PRONTO_CHAT_Android_Web_Project.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -o PRONTO_CHAT_Android_Web_Project.zip -d pronto

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle -p pronto/android assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: PRONTO-CHAT-APK
          path: pronto/android/app/build/outputs/apk/debug/app-debug.apk
