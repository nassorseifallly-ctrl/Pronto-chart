
name: Build PRONTO CHAT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p pronto
          ZIP=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No project ZIP found"
            exit 1
          fi
          unzip -o "$ZIP" -d pronto
          PROJECT=$(find pronto -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: No Gradle Android project found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRONTO-CHAT-APK
          path: pronto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
