
name: Build PRONTO CHAT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir pronto
          ZIP=$(find . -name "*.zip" | head -n 1)
          unzip -o "$ZIP" -d pronto
          PROJECT=$(find pronto -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PRONTO-CHAT-APK
          path: pronto/**/build/outputs/apk/debug/*.apk
