
name: Build PRONTO CHAT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract PRONTO CHAT project
        run: |
          unzip -o PRONTO_CHAT_Android_Web_Project.zip -d project

      - name: Build APK
        run: |
          gradle -p project/android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRONTO-CHAT-APK
          path: project/android/app/build/outputs/apk/debug/*.apk
